<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0b"/>
      <stop offset="100%" style="stop-color:#1a1a1f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Orbital rings -->
  <circle cx="600" cy="315" r="180" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>
  <circle cx="600" cy="315" r="120" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.5"/>
  <circle cx="600" cy="315" r="60" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.8"/>
  <circle cx="600" cy="315" r="12" fill="url(#accent)"/>
  
  <!-- Text -->
  <text x="600" y="280" font-family="system-ui, sans-serif" font-size="64" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-2px">ORBITAL</text>
  <text x="600" y="350" font-family="system-ui, sans-serif" font-size="24" font-weight="400" fill="#888" text-anchor="middle" letter-spacing="4px">STUDIO</text>
  <text x="600" y="420" font-family="system-ui, sans-serif" font-size="18" font-weight="300" fill="#666" text-anchor="middle" letter-spacing="2px">GRAPHIC DESIGN &amp; CREATIVE DIRECTION</text>
  
  <!-- Accent line -->
  <line x1="500" y1="450" x2="700" y2="450" stroke="url(#accent)" stroke-width="2"/>
</svg>